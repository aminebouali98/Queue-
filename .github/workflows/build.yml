name: Build Queue TV - Android 10+

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android 10+ APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Find and extract Queue TV project
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f \( \
            -name 'QueueTV-Android10Plus-HiddenSettings.zip' -o \
            -name 'QueueTV-GitHub-Actions-Android6Plus.zip' -o \
            -name 'QueueTV-GitHub-Actions-Android10Plus.zip' \
          \) | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Queue TV project ZIP was not found."
            echo "Upload the updated Queue TV ZIP to the repository root."
            exit 1
          fi

          echo "Using project archive: $ZIP_FILE"
          unzip -q "$ZIP_FILE" -d extracted

          if [ ! -f extracted/QueueTV/app/build.gradle ]; then
            echo "ERROR: Android project files are missing."
            find extracted -maxdepth 4 -type f
            exit 1
          fi

      - name: Verify Android 10 minimum
        run: |
          grep -q 'minSdk 29' extracted/QueueTV/app/build.gradle || {
            echo "ERROR: Project must have minSdk 29 for Android 10+."
            exit 1
          }

      - name: Build Android APK
        run: |
          cd extracted/QueueTV
          gradle --no-daemon assembleDebug

      - name: Upload Android 10+ APK
        uses: actions/upload-artifact@v4
        with:
          name: QueueTV-Android10-APK
          path: extracted/QueueTV/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
